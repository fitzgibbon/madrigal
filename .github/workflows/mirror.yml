name: Mirror Pijul Nest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: mirror-pijul-nest
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub mirror
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Install Pijul
        run: nix profile install nixpkgs#pijul

      - name: Clone authoritative repository
        run: |
          pijul clone \
            https://nest.pijul.com/fitzgibbon/madrigal \
            "$RUNNER_TEMP/madrigal"

      - name: Synchronize working tree
        run: |
          rsync -a --delete \
            --exclude=.pijul/ \
            --exclude=.git/ \
            --exclude=.github/workflows/mirror.yml \
            "$RUNNER_TEMP/madrigal/" ./

      - name: Mark README as a mirror
        run: |
          {
            IFS= read -r title
            IFS= read -r _
            printf '%s\n\n' "$title"
            printf '%s\n' '#+begin_quote'
            printf '%s\n' 'This is a read-only GitHub mirror of the [[https://nest.pijul.com/fitzgibbon/madrigal][upstream repository on Pijul Nest]].'
            printf '%s\n\n' '#+end_quote'
            cat
          } < README.org > README.org.mirror
          mv README.org.mirror README.org

      - name: Commit changes
        run: |
          git config user.name "Madrigal mirror"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Mirror is current"
          else
            git commit -m "Mirror Pijul Nest"
            git push
          fi
